# GRID Corpus: AV модель с CrossAttentionFusion.
# Главный эксперимент работы.

experiment:
  name: grid_av_crossattn
  seed: 42
  output_dir: checkpoints/grid_av_crossattn

data:
  train_manifest: /content/drive/MyDrive/avsr/grid/manifests/train.jsonl
  val_manifest:   /content/drive/MyDrive/avsr/grid/manifests/val.jsonl
  max_duration: 8.0
  min_duration: 0.5
  num_workers: 2
  batch_size: 4           # AV режим — батч поменьше из-за VRAM
  grad_accum: 4           # эффективный батч = 16

audio:
  sample_rate: 16000
  n_mels: 80
  hop_length: 160
  win_length: 400

video:
  fps: 25
  lip_size: 96

model:
  mode: av                # ВАЖНО: оба канала
  d_model: 512
  modality_dropout: 0.1   # 10% — обнуляем одну ветку для устойчивости

  audio_encoder:
    name: openai/whisper-small
    freeze: true
    d_audio: 768

  video_encoder:
    d_video: 512
    n_layers: 4
    n_heads: 8

  fusion:
    type: cross_attention
    n_layers: 2
    n_heads: 8
    dropout: 0.1

training:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_epochs: 8
  patience: 3
  grad_clip: 5.0
  mixed_precision: true
  label_smoothing: 0.0

augmentation:
  audio:
    spec_augment: true
    freq_mask: 27
    time_mask: 10
    noise_snr_db: [0, 5, 10, 15, 20]
    noise_prob: 0.5       # включаем шум в обучении — важно для AV
  video:
    horizontal_flip: 0.5
    random_crop: 88
    brightness: 0.2

logging:
  use_tensorboard: true
  use_wandb: false
  log_every_n_steps: 25
  val_every_n_epochs: 1
